
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
<h1>Edite seu texto</h1>

<p id="texto" contenteditable="true" data-placeholder="Digite seu texto aqui..."></p>

<hr>

<button onclick="negrito()" style="font-weight: bold;">N</button>
<button onclick="italico()" style="font-style: italic;">I</button>
<button onclick="sublinhado()" style="text-decoration: underline;">S</button>

<label for="cor">Cor:</label>
<input type="color" id="cor" onchange="alterarCor()">

<label for="fonte">Fonte:</label>
<select id="fonte" onchange="alterarFonte()">
    <option value="Arial">Arial</option>
    <option value="Georgia">Georgia</option>
    <option value="Verdana">Verdana</option>
    <option value="Courier New">Courier New</option>
    <option value="Times New Roman">Times New Roman</option>
    <option value="Impact">Impact</option>
    <option value="Comic Sans MS">Comic Sans MS</option>

</select>

<button onclick="zoom('aumentar')">A+</button>
<button onclick="zoom('diminuir')">A-</button>

<button onclick="alterarTema()" id="tema">🌑</button>

<script src="script.js"></script>
</body>
